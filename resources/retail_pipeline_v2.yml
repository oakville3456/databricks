resources:
  jobs:
    retail_pipeline_v2:
      name: retail_pipeline_v2
      description: "Bronze -> Silver MERGE -> Gold (Priority 6 - Workflows)"

      tasks:
        - task_key: bronze_ingest
          notebook_task:
            notebook_path: /Repos/oakville3456@hotmail.com/databricks/01 bronze ingest auto load
          environment_key: serverless

        - task_key: silver_upsert
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: /Repos/oakville3456@hotmail.com/databricks/04_silver_upsert
          environment_key: serverless

        - task_key: gold_aggregate
          depends_on:
            - task_key: silver_upsert
          notebook_task:
            notebook_path: /Repos/oakville3456@hotmail.com/databricks/03 gold aggregate
          environment_key: serverless

      environments:
        - environment_key: serverless
          spec:
            client: "1"

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/New_York

      email_notifications:
        on_start:
          - oakville3456@hotmail.com
        on_failure:
          - oakville3456@hotmail.com
